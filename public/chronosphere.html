<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronosphere — The Atlas of Oddities</title>
    <meta
      name="description"
      content="Travel through time on a map that changes style with each era, and uncover Earth's strangest true stories."
    />
    <style>
      :root {
        --bg: #e9d9b4;
        --land: #c9a96e;
        --landStroke: #7a5a2b;
        --sea: #e9d9b4;
        --ink: #3b2a14;
        --accent: #8b3a1a;
        --panel: #f4e8cc;
        --font: 'Cinzel', Georgia, serif;
        --body: 'Georgia', serif;
        --grid: rgba(122, 90, 43, 0.15);
        --glow: 0 0 16px rgba(139, 58, 26, 0.2);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        transition: background 0.8s, color 0.8s;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid var(--landStroke);
      }

      h1 {
        margin: 0;
        font-family: var(--font);
        font-size: 22px;
        letter-spacing: 0.08em;
        text-shadow: var(--glow);
      }

      h1 small {
        display: block;
        font-family: var(--body);
        font-size: 12px;
        opacity: 0.7;
        letter-spacing: 0.2em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .lang-toggle {
        display: inline-flex;
        gap: 6px;
        border: 1px solid var(--landStroke);
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255,255,255,0.12);
      }

      button {
        font-family: var(--font);
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--landStroke);
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.3s;
      }

      button:hover, button.active {
        background: var(--accent);
        color: var(--panel);
      }

      .lang-toggle button {
        border: 0;
        border-radius: 0;
        padding: 5px 10px;
        min-width: 52px;
      }

      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      #map {
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
        display: block;
      }

      #map:active { cursor: grabbing; }

      .land:hover { filter: brightness(1.15); }
      .land {
        fill: var(--land);
        stroke: var(--landStroke);
        stroke-width: 0.7;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round;
        transition: fill 0.8s, stroke 0.8s;
      }
      .sea { fill: var(--sea); transition: fill 0.8s; }
      .gridline {
        stroke: var(--grid);
        stroke-width: 0.6;
        fill: none;
      }

      .marker {
        cursor: pointer;
        transition: opacity 0.4s;
      }
      .marker .dot {
        fill: var(--accent);
        stroke: var(--panel);
        stroke-width: 1.5;
      }
      .marker .halo {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
        animation: pulse 2s infinite;
      }
      .marker.dim { opacity: 0.18; }

      @keyframes pulse {
        0% { r: 6; opacity: 1; }
        100% { r: 18; opacity: 0; }
      }

      .deco {
        transition: opacity 0.8s;
        opacity: 0;
        pointer-events: none;
      }
      .deco.on { opacity: 1; }

      #sweep {
        transform-origin: 500px 250px;
        animation: spin 6s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      #eraLabel {
        position: absolute;
        left: 20px;
        top: 16px;
        font-family: var(--font);
        font-size: 28px;
        text-shadow: var(--glow);
        pointer-events: none;
      }

      #eraLabel span {
        display: block;
        font-family: var(--body);
        font-size: 14px;
        opacity: 0.7;
      }

      #zoom {
        position: absolute;
        left: 20px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #zoom button {
        width: 34px;
        height: 34px;
        padding: 0;
        background: var(--panel);
      }

      #drawer {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: min(380px, 90vw);
        background: var(--panel);
        border-left: 2px solid var(--landStroke);
        padding: 24px;
        overflow: auto;
        transform: translateX(105%);
        transition: transform 0.4s ease;
        box-shadow: -8px 0 24px rgba(0,0,0,0.1);
      }

      #drawer.open { transform: none; }

      #drawer h2 {
        font-family: var(--font);
        margin: 0.2em 0;
        text-shadow: var(--glow);
      }

      #drawer .meta {
        opacity: 0.7;
        font-style: italic;
      }

      #drawer .close {
        position: absolute;
        top: 10px;
        right: 10px;
      }

      .reacts {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 14px 0;
      }

      .tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .tags button { font-size: 12px; }

      footer {
        height: 110px;
        padding: 10px 20px;
        border-top: 1px solid var(--landStroke);
      }

      .yearrow {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      input[type=range] {
        flex: 1;
        accent-color: var(--accent);
      }

      #year {
        font-family: var(--font);
        font-size: 26px;
        min-width: 150px;
        text-align: right;
        text-shadow: var(--glow);
      }

      .epochs {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .epochs button {
        flex: 1;
        font-size: 12px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>

        <small data-i18n="appSubtitle">THE ATLAS OF ODDITIES</small>

        </div>
        <button id="random" type="button" data-i18n="random">🎲 Random</button>
        <button id="sound" type="button" data-i18n="soundOff">🔇 Sound off</button>

    <main>

          <g id="markers">

              <circle class="dot" cx="680" cy="260" r="4"></circle>

      <div id="zoom">
        <button type="button" aria-label="Zoom in">+</button>
        <button type="button" aria-label="Zoom out">−</button>
      </div>

      <aside id="drawer" aria-live="polite" aria-labelledby="story-title">
        <button class="close" id="closeDrawer" type="button" aria-label="Close story">✕</button>
        <p class="meta" id="storyMeta">Ancient • -3000</p>
        <h2 id="story-title">The Moon-Glass Temple</h2>
        <p id="storyText">Stone watchers etched the first calendars into obsidian, believing the heavens were a ledger of human fate.</p>
        <div class="reacts" id="storyReacts">
          <button type="button">✦</button>
          <button type="button">☄</button>
          <button type="button">✧</button>
        </div>
        <div class="tags" id="storyTags"></div>
      </aside>
    </main>

    <footer>
      <div class="yearrow">
        <input id="yearSlider" type="range" min="-3000" max="2025" step="1" value="-3000" aria-label="Year selector" />
        <div id="year">-3000</div>
      </div>
      <div class="epochs" id="epochs"></div>
    </footer>

    <script>
      const translations = {
        en: {
          appTitle: 'CHRONOSPHERE',
          appSubtitle: 'THE ATLAS OF ODDITIES',
          random: '🎲 Random',
          soundOn: '🔊 Sound on',
          soundOff: '🔇 Sound off',
          eraLabel: 'Era',
          ancient: 'Ancient',
          discovery: 'Discovery',
          victorian: 'Victorian',
          coldwar: 'Cold War',
          digital: 'Digital',
          hidden: 'Hidden',
          close: 'Close',
          mapLabel: 'Map',
          storyMeta: 'Era • Year',
          eraMeta: 'Ancient • -3000',
          randomStory: 'Random story',
          openStory: 'Open story',
          all: 'All',
          goTo: 'Go to',
          sigils: 'Sigils',
          anomalies: 'Anomalies',
          archives: 'Archives',

          myths: 'Myths',

          science: 'Science',

              tags: ['Sigils', 'Myths', 'Relics']
            },
            discovery: {

            },
            victorian: {
              title: 'The Silent Observatory',
              meta: 'Victorian • 1880',
              text: 'A brass telescope recorded a signal no one could explain, but every scientist in the city agreed it was not man-made.',
              tags: ['Science', 'Echoes', 'Relics']
            },
            coldwar: {
              title: 'The Cold Arc',
              meta: 'Cold War • 1969',
              text: 'A satellite passed over the poles and captured a ring of light that only appeared during military communications.',
              tags: ['Science', 'Anomalies', 'Archives']
            },
            digital: {
              title: 'The Last Archive of Time',

            }

        },
        sk: {
          appTitle: 'CHRONOSFÉRA',
          appSubtitle: 'ATLAS ODDIT',

          soundOn: '🔊 Zvuk zapnutý',
          soundOff: '🔇 Zvuk vypnutý',
          eraLabel: 'Obdobie',
          ancient: 'Starovek',

          victorian: 'Viktoriánske',
          coldwar: 'Studená vojna',
          digital: 'Digitálne',
          hidden: 'Skryté',
          close: 'Zavrieť',
          mapLabel: 'Mapa',
          storyMeta: 'Obdobie • Rok',
          eraMeta: 'Starovek • -3000',
          randomStory: 'Náhodný príbeh',
          openStory: 'Otvoriť príbeh',
          all: 'Všetko',
          goTo: 'Prejsť na',
          sigils: 'Znakové',
          anomalies: 'Anomálie',
          archives: 'Archívy',
          relics: 'Relikvie',
          myths: 'Mýty',
          echoes: 'Ozveny',
          science: 'Veda',
          stories: {
            ancient: {

              meta: 'Starovek • -3000',
              text: 'Kamenní pozorovatelia vyrezali prvé kalendáre do obsidiánu a verili, že nebesá sú záznamom ľudskej vôle.',
              tags: ['Znakové', 'Mýty', 'Relikvie']
            },

              meta: 'Objavovanie • 1500',
              text: 'Kartograf si všimol, že jeho pobrežie sa každý večer posúva, akoby sa svet stále dopisoval.',
              tags: ['Anomálie', 'Archívy', 'Ozveny']
            },
            victorian: {
              title: 'Tichá observatórium',
              meta: 'Viktoriánske • 1880',
              text: 'Mosadzný ďalekohľad zaznamenal signál, ktorý nikto nedokázal vysvetliť, ale všetci vedci v meste sa zhodli, že nebol človekom vytvorený.',
              tags: ['Veda', 'Ozveny', 'Relikvie']
            },

              meta: 'Studená vojna • 1969',

            }
          }

      };

      const eras = [
        { id: 'ancient', year: -3000, labelKey: 'ancient', label: 'Ancient', skLabel: 'Starovek' },
        { id: 'discovery', year: 1500, labelKey: 'discovery', label: 'Discovery', skLabel: 'Objavovanie' },
        { id: 'victorian', year: 1880, labelKey: 'victorian', label: 'Victorian', skLabel: 'Viktoriánske' },
        { id: 'coldwar', year: 1969, labelKey: 'coldwar', label: 'Cold War', skLabel: 'Studená vojna' },
        { id: 'digital', year: 2025, labelKey: 'digital', label: 'Digital', skLabel: 'Digitálne' }
      ];

      const state = {
        lang: 'en',
        soundOn: false,
        activeEra: 'ancient',
        year: -3000,
        drawerOpen: false
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];

      function getCurrentText(key) {
        return translations[state.lang][key] || key;
      }

      function applyLanguage() {
        document.documentElement.lang = state.lang;

        $$('[data-i18n]').forEach((el) => {
          const key = el.dataset.i18n;
          if (key === 'appTitle' || key === 'appSubtitle' || key === 'random' || key === 'soundOff' || key === 'soundOn' || key === 'eraLabel') {
            el.textContent = getCurrentText(key);
          }
        });

        const soundBtn = $('#sound');
        soundBtn.textContent = state.soundOn ? getCurrentText('soundOn') : getCurrentText('soundOff');

        $$('.lang-toggle button').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.lang === state.lang);
        });

        const era = eras.find((item) => item.id === state.activeEra) || eras[0];
        $('#eraName').textContent = state.lang === 'en' ? era.label : era.skLabel;

        renderStory();
      }

      function createGrid() {
        const grid = $('#grid');
        grid.innerHTML = '';

        for (let x = 0; x <= 1000; x += 50) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x);
          line.setAttribute('y1', 0);
          line.setAttribute('x2', x);
          line.setAttribute('y2', 500);
          line.setAttribute('class', 'gridline');
          grid.appendChild(line);
        }

        for (let y = 0; y <= 500; y += 50) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', 0);
          line.setAttribute('y1', y);
          line.setAttribute('x2', 1000);
          line.setAttribute('y2', y);
          line.setAttribute('class', 'gridline');
          grid.appendChild(line);
        }
      }

      function renderEpochButtons() {
        const epochs = $('#epochs');
        epochs.innerHTML = '';

        eras.forEach((era) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = state.lang === 'en' ? era.label : era.skLabel;
          button.classList.toggle('active', era.id === state.activeEra);
          button.addEventListener('click', () => {
            state.activeEra = era.id;
            state.year = era.year;
            $('#yearSlider').value = String(era.year);
            $('#year').textContent = String(era.year);
            updateEraVisuals();
            renderStory();
          });
          epochs.appendChild(button);
        });
      }

      function updateEraVisuals() {
        const era = eras.find((item) => item.id === state.activeEra) || eras[0];
        $('#eraName').textContent = state.lang === 'en' ? era.label : era.skLabel;
        $$('.deco').forEach((layer) => layer.classList.remove('on'));

        const activeLayer = document.getElementById(`d-${state.activeEra}`);
        if (activeLayer) activeLayer.classList.add('on');

        $$('.marker').forEach((marker) => {
          const isActive = marker.dataset.location === state.activeEra;
          marker.classList.toggle('dim', !isActive);
        });

        renderEpochButtons();
      }

      function renderStory() {
        const story = translations[state.lang].stories[state.activeEra];
        const meta = $('#storyMeta');
        const title = $('#story-title');
        const storyText = $('#storyText');
        const tags = $('#storyTags');

        meta.textContent = story.meta;
        title.textContent = story.title;
        storyText.textContent = story.text;
        tags.innerHTML = '';
        story.tags.forEach((tag) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = tag;
          tags.appendChild(btn);
        });
      }

      function setLanguage(lang) {
        state.lang = lang;
        $('#year').textContent = String(state.year);
        applyLanguage();
        updateEraVisuals();
      }

      function bindEvents() {
        $('#random').addEventListener('click', () => {
          const randomEra = eras[Math.floor(Math.random() * eras.length)];
          state.activeEra = randomEra.id;
          state.year = randomEra.year;
          $('#yearSlider').value = String(randomEra.year);
          $('#year').textContent = String(randomEra.year);
          updateEraVisuals();
          renderStory();
        });

        $('#sound').addEventListener('click', () => {
          state.soundOn = !state.soundOn;
          applyLanguage();
        });

        $('#closeDrawer').addEventListener('click', () => {
          state.drawerOpen = false;
          $('#drawer').classList.remove('open');
        });

        $('#yearSlider').addEventListener('input', (event) => {
          state.year = Number(event.target.value);
          $('#year').textContent = String(state.year);

          const closestEra = eras.reduce((best, era) => {
            const diff = Math.abs(era.year - state.year);
            return diff < Math.abs(best.year - state.year) ? era : best;
          }, eras[0]);

          state.activeEra = closestEra.id;
          updateEraVisuals();
          renderStory();
        });

        $$('.lang-toggle button').forEach((button) => {
          button.addEventListener('click', () => {
            setLanguage(button.dataset.lang);
          });
        });

        $$('.marker').forEach((marker) => {
          marker.addEventListener('click', () => {
            state.activeEra = marker.dataset.location;
            state.year = Number(marker.dataset.year);
            $('#yearSlider').value = String(state.year);
            $('#year').textContent = String(state.year);
            updateEraVisuals();
            renderStory();
            state.drawerOpen = true;
            $('#drawer').classList.add('open');
          });
        });
      }

      createGrid();
      bindEvents();
      renderEpochButtons();
      updateEraVisuals();
      renderStory();
      applyLanguage();
    </script>
  </body>
</html>
