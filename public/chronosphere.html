<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chronosphere — The Atlas of Oddities</title>
    <meta name="description" content="Travel through time on a map that changes style with each era, and uncover Earth's strangest true stories." />
    <style>
      :root {
        --bg: #e9d9b4;
        --land: #c9a96e;
        --landStroke: #7a5a2b;
        --sea: #e9d9b4;
        --ink: #3b2a14;
        --accent: #8b3a1a;
        --panel: #f4e8cc;
        --font: 'Georgia', serif;
        --body: 'Georgia', serif;
        --grid: rgba(122, 90, 43, 0.15);
        --glow: 0 0 16px rgba(139, 58, 26, 0.2);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 20px;
        border-bottom: 1px solid var(--landStroke);
      }
      h1 {
        margin: 0;
        font-family: var(--font);
        font-size: 22px;
        line-height: 1.1;
        letter-spacing: .08em;
        text-shadow: var(--glow);
      }
      h1 small {
        display: block;
        font-family: var(--body);
        font-size: 12px;
        opacity: .7;
        letter-spacing: .2em;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .lang-toggle {
        display: inline-flex;
        border: 1px solid var(--landStroke);
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255,255,255,0.1);
      }
      .lang-toggle button {
        border: none;
        border-radius: 0;
        padding: 5px 10px;
        font-size: 12px;
      }
      button {
        font-family: var(--font);
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--landStroke);
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        transition: all .3s;
      }
      button:hover, button.active {
        background: var(--accent);
        color: var(--panel);
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #map {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
        touch-action: none;
      }
      #map:active { cursor: grabbing; }
      .sea {
        fill: var(--sea);
      }
      .land {
        fill: var(--land);
        stroke: var(--landStroke);
        stroke-width: 0.7;
        vector-effect: non-scaling-stroke;
        stroke-linejoin: round;
        transition: fill .8s, stroke .8s;
      }
      .land:hover { filter: brightness(1.12); }
      .gridline {
        stroke: var(--grid);
        stroke-width: 0.6;
        fill: none;
      }
      .marker { cursor: pointer; transition: opacity .3s; }
      .marker .halo {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1;
        animation: pulse 2s infinite;
      }
      .marker .dot {
        fill: var(--accent);
        stroke: var(--panel);
        stroke-width: 1.5;
      }
      .marker.dim { opacity: .18; }
      @keyframes pulse {
        0% { r: 6; opacity: 1; }
        100% { r: 18; opacity: 0; }
      }
      .deco {
        opacity: 0;
        pointer-events: none;
        transition: opacity .8s;
      }
      .deco.on { opacity: 1; }
      #eraLabel {
        position: absolute;
        left: 20px;
        top: 16px;
        font-family: var(--font);
        font-size: 28px;
        text-shadow: var(--glow);
        pointer-events: none;
      }
      #eraLabel span {
        display: block;
        font-family: var(--body);
        font-size: 12px;
        opacity: .7;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      #zoom {
        position: absolute;
        left: 20px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      #zoom button {
        width: 34px;
        height: 34px;
        padding: 0;
        background: var(--panel);
      }
      #drawer {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        width: min(380px, 90vw);
        background: var(--panel);
        border-left: 2px solid var(--landStroke);
        padding: 24px;
        overflow: auto;
        transform: translateX(105%);
        transition: transform .35s ease;
        box-shadow: -8px 0 24px rgba(0,0,0,.12);
      }
      #drawer.open { transform: none; }
      #drawer h2 { margin: .2em 0; font-family: var(--font); text-shadow: var(--glow); }
      #drawer .meta { opacity: .7; font-style: italic; }
      #drawer .close { position: absolute; top: 10px; right: 10px; }
      .reacts { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
      .tags { display: flex; gap: 6px; flex-wrap: wrap; }
      .tags button { font-size: 12px; }
      footer {
        height: 110px;
        padding: 10px 20px;
        border-top: 1px solid var(--landStroke);
      }
      .yearrow {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      input[type=range] { flex:1; accent-color: var(--accent); }
      #year {
        font-family: var(--font);
        font-size: 26px;
        min-width: 150px;
        text-align: right;
        text-shadow: var(--glow);
      }
      .epochs {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .epochs button { flex: 1; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <span data-i18n="appTitle">CHRONOSPHERE</span>
        <small data-i18n="appSubtitle">THE ATLAS OF ODDITIES</small>
      </h1>
      <div class="header-actions">
        <div class="lang-toggle" aria-label="Language switcher">
          <button type="button" data-lang="en" class="active">EN</button>
          <button type="button" data-lang="sk">SK</button>
        </div>
        <button id="random" type="button" data-i18n="random">🎲 Random</button>
        <button id="sound" type="button" data-i18n="soundOff">🔇 Sound off</button>
      </div>
    </header>

    <main>
      <div id="eraLabel">
        <span data-i18n="eraLabel">Era</span>
        <strong id="eraName">Ancient</strong>
      </div>

      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" aria-label="Chronosphere map">
        <g id="world">
          <rect class="sea" x="-2000" y="-2000" width="5000" height="4500"></rect>
          <g id="grid"></g>

          <g id="d-ancient" class="deco on">
            <text x="380" y="215" font-family="Georgia, serif" font-size="14" fill="currentColor" opacity="0.6">MARE OCEANVM</text>
          </g>
          <g id="d-discovery" class="deco"></g>
          <g id="d-victorian" class="deco"></g>
          <g id="d-coldwar" class="deco">
            <circle cx="500" cy="250" r="100" class="gridline"></circle>
            <circle cx="500" cy="250" r="200" class="gridline"></circle>
            <circle cx="500" cy="250" r="300" class="gridline"></circle>
            <g id="sweep">
              <path d="M500 250 L800 250 A300 300 0 0 0 760 100 Z" fill="rgba(80,255,120,.12)"></path>
            </g>
          </g>
          <g id="d-digital" class="deco"></g>

          <g id="lands">
            <path class="land" d="M111,186 L150,176 L189,181 L212,198 L219,221 L198,236 L165,242 L141,229 L112,212 Z"></path>
            <path class="land" d="M243,176 L287,159 L331,167 L352,186 L348,206 L308,219 L270,216 L247,202 Z"></path>
            <path class="land" d="M430,112 L454,101 L490,101 L512,118 L517,146 L500,164 L470,171 L444,160 L426,139 Z"></path>
            <path class="land" d="M540,118 L566,111 L592,116 L610,130 L618,154 L596,170 L568,170 L550,157 L536,137 Z"></path>
            <path class="land" d="M620,175 L646,167 L678,172 L704,190 L716,212 L702,232 L670,238 L636,230 L612,205 Z"></path>
            <path class="land" d="M772,184 L808,179 L846,190 L868,213 L863,239 L826,247 L792,239 L772,218 Z"></path>
            <path class="land" d="M336,303 L371,289 L413,289 L438,304 L446,331 L417,346 L370,347 L340,332 Z"></path>
            <path class="land" d="M507,295 L542,290 L574,297 L590,318 L588,345 L557,359 L515,353 L493,333 Z"></path>
            <path class="land" d="M649,292 L681,286 L718,291 L737,309 L735,336 L701,350 L666,347 L644,322 Z"></path>
            <path class="land" d="M814,297 L848,292 L885,298 L904,320 L895,348 L866,359 L831,355 L806,332 Z"></path>
            <path class="land" d="M930,258 L953,260 L969,275 L968,294 L949,307 L924,304 L910,287 Z"></path>
            <path class="land" d="M26,293 L41,286 L56,292 L62,305 L59,318 L42,324 L25,317 Z"></path>
            <path class="land" d="M848,145 L859,141 L874,146 L883,162 L878,177 L861,180 L846,171 Z"></path>
            <path class="land" d="M156,286 L171,281 L189,287 L196,303 L191,319 L170,325 L152,312 Z"></path>
            <path class="land" d="M272,305 L286,299 L303,303 L311,318 L306,334 L288,340 L271,332 Z"></path>
            <path class="land" d="M720,158 L736,154 L753,160 L759,177 L746,189 L728,186 L714,170 Z"></path>
            <path class="land" d="M463,200 L477,196 L495,202 L500,219 L490,233 L472,235 L459,223 Z"></path>
            <path class="land" d="M623,243 L641,239 L661,246 L666,264 L656,279 L636,281 L621,266 Z"></path>
            <path class="land" d="M583,246 L595,241 L612,246 L616,260 L606,275 L588,274 L580,261 Z"></path>
            <path class="land" d="M377,199 L392,195 L408,201 L412,216 L399,230 L382,229 L370,214 Z"></path>
          </g>

          <g id="markers">
            <g class="marker" data-location="ancient" data-year="-3000">
              <circle class="halo" cx="500" cy="250" r="6"></circle>
              <circle class="dot" cx="500" cy="250" r="4"></circle>
            </g>
            <g class="marker" data-location="discovery" data-year="1500">
              <circle class="halo" cx="410" cy="180" r="6"></circle>
              <circle class="dot" cx="410" cy="180" r="4"></circle>
            </g>
            <g class="marker" data-location="victorian" data-year="1880">
              <circle class="halo" cx="585" cy="220" r="6"></circle>
              <circle class="dot" cx="585" cy="220" r="4"></circle>
            </g>
            <g class="marker" data-location="coldwar" data-year="1969">
              <circle class="halo" cx="680" cy="260" r="6"></circle>
              <circle class="dot" cx="680" cy="260" r="4"></circle>
            </g>
            <g class="marker" data-location="digital" data-year="2025">
              <circle class="halo" cx="840" cy="210" r="6"></circle>
              <circle class="dot" cx="840" cy="210" r="4"></circle>
            </g>
          </g>
        </g>
      </svg>

      <div id="zoom">
        <button type="button" aria-label="Zoom in">+</button>
        <button type="button" aria-label="Zoom out">−</button>
      </div>

      <aside id="drawer" aria-live="polite" aria-labelledby="story-title">
        <button class="close" id="closeDrawer" type="button" aria-label="Close story">✕</button>
        <p class="meta" id="storyMeta">Ancient • -3000</p>
        <h2 id="story-title">The Moon-Glass Temple</h2>
        <p id="storyText">Stone watchers etched the first calendars into obsidian, believing the heavens were a ledger of human fate.</p>
        <div class="reacts" id="storyReacts">
          <button type="button">✦</button>
          <button type="button">☄</button>
          <button type="button">✧</button>
        </div>
        <div class="tags" id="storyTags"></div>
      </aside>
    </main>

    <footer>
      <div class="yearrow">
        <input id="yearSlider" type="range" min="-3000" max="2025" step="1" value="-3000" aria-label="Year selector" />
        <div id="year">-3000</div>
      </div>
      <div class="epochs" id="epochs"></div>
    </footer>

    <script>
      const translations = {
        en: {
          appTitle: 'CHRONOSPHERE',
          appSubtitle: 'THE ATLAS OF ODDITIES',
          random: '🎲 Random',
          soundOn: '🔊 Sound on',
          soundOff: '🔇 Sound off',
          eraLabel: 'Era',
          ancient: 'Ancient',
          discovery: 'Discovery',
          victorian: 'Victorian',
          coldwar: 'Cold War',
          digital: 'Digital',
          stories: {
            ancient: {
              title: 'The Moon-Glass Temple',
              meta: 'Ancient • -3000',
              text: 'Stone watchers etched the first calendars into obsidian, believing the heavens were a ledger of human fate.',
              tags: ['Sigils', 'Myths', 'Relics']
            },
            discovery: {
              title: 'The Map That Moved',
              meta: 'Discovery • 1500',
              text: 'A cartographer noticed his coastline drifted every night, as if the world itself was still being written.',
              tags: ['Anomalies', 'Archives', 'Echoes']
            },
            victorian: {
              title: 'The Silent Observatory',
              meta: 'Victorian • 1880',
              text: 'A brass telescope recorded a signal no one could explain, but every scientist agreed it was not man-made.',
              tags: ['Science', 'Echoes', 'Relics']
            },
            coldwar: {
              title: 'The Cold Arc',
              meta: 'Cold War • 1969',
              text: 'A satellite passed over the poles and captured a ring of light that only appeared during military communications.',
              tags: ['Science', 'Anomalies', 'Archives']
            },
            digital: {
              title: 'The Last Archive of Time',
              meta: 'Digital • 2025',
              text: 'A crowd-sourced archive started reproducing vanished moments from the past, one story at a time.',
              tags: ['Archives', 'Echoes', 'Myths']
            }
          }
        },
        sk: {
          appTitle: 'CHRONOSFÉRA',
          appSubtitle: 'ATLAS ODDIT',
          random: '🎲 Náhodne',
          soundOn: '🔊 Zvuk zapnutý',
          soundOff: '🔇 Zvuk vypnutý',
          eraLabel: 'Obdobie',
          ancient: 'Starovek',
          discovery: 'Objavovanie',
          victorian: 'Viktoriánske',
          coldwar: 'Studená vojna',
          digital: 'Digitálne',
          stories: {
            ancient: {
              title: 'Mesiacovo-sklenený chrám',
              meta: 'Starovek • -3000',
              text: 'Kamenní pozorovatelia vyrezali prvé kalendáre do obsidiánu a verili, že nebesá sú záznamom ľudskej vôle.',
              tags: ['Znakové', 'Mýty', 'Relikvie']
            },
            discovery: {
              title: 'Mapa, ktorá sa pohla',
              meta: 'Objavovanie • 1500',
              text: 'Kartograf si všimol, že jeho pobrežie sa každý večer posúva, akoby sa svet stále dopisoval.',
              tags: ['Anomálie', 'Archívy', 'Ozveny']
            },
            victorian: {
              title: 'Tiché observatórium',
              meta: 'Viktoriánske • 1880',
              text: 'Mosadzný ďalekohľad zaznamenal signál, ktorý nikto nedokázal vysvetliť, ale všetci vedci sa zhodli, že nebol človekom vytvorený.',
              tags: ['Veda', 'Ozveny', 'Relikvie']
            },
            coldwar: {
              title: 'Studený oblúk',
              meta: 'Studená vojna • 1969',
              text: 'Satelit preletel nad pólmi a zachytil prstenec svetla, ktorý sa objavil iba počas vojenských komunikačných signálov.',
              tags: ['Veda', 'Anomálie', 'Archívy']
            },
            digital: {
              title: 'Posledný archív času',
              meta: 'Digitálne • 2025',
              text: 'Spoločenský archív začal znovu vytvárať zmiznuté okamihy z minulosti, jeden príbeh po druhom.',
              tags: ['Archívy', 'Ozveny', 'Mýty']
            }
          }
        }
      };

      const eras = [
        { id: 'ancient', year: -3000, label: 'Ancient', skLabel: 'Starovek' },
        { id: 'discovery', year: 1500, label: 'Discovery', skLabel: 'Objavovanie' },
        { id: 'victorian', year: 1880, label: 'Victorian', skLabel: 'Viktoriánske' },
        { id: 'coldwar', year: 1969, label: 'Cold War', skLabel: 'Studená vojna' },
        { id: 'digital', year: 2025, label: 'Digital', skLabel: 'Digitálne' }
      ];

      const state = {
        lang: 'en',
        activeEra: 'ancient',
        year: -3000,
        soundOn: false,
        drawerOpen: false
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];

      function setLanguage(lang) {
        state.lang = lang;
        document.documentElement.lang = lang;

        $$('[data-i18n]').forEach((el) => {
          const key = el.dataset.i18n;
          el.textContent = translations[lang][key] || el.textContent;
        });

        const soundBtn = $('#sound');
        soundBtn.textContent = state.soundOn ? translations[lang].soundOn : translations[lang].soundOff;

        $$('.lang-toggle button').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        updateEraVisuals();
        renderStory();
      }

      function createGrid() {
        const grid = $('#grid');
        grid.innerHTML = '';
        for (let x = 0; x <= 1000; x += 50) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x); line.setAttribute('y1', 0);
          line.setAttribute('x2', x); line.setAttribute('y2', 500);
          line.setAttribute('class', 'gridline');
          grid.appendChild(line);
        }
        for (let y = 0; y <= 500; y += 50) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', 0); line.setAttribute('y1', y);
          line.setAttribute('x2', 1000); line.setAttribute('y2', y);
          line.setAttribute('class', 'gridline');
          grid.appendChild(line);
        }
      }

      function renderEpochButtons() {
        const epochs = $('#epochs');
        epochs.innerHTML = '';
        eras.forEach((era) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = state.lang === 'en' ? era.label : era.skLabel;
          btn.classList.toggle('active', era.id === state.activeEra);
          btn.addEventListener('click', () => {
            state.activeEra = era.id;
            state.year = era.year;
            $('#yearSlider').value = String(era.year);
            $('#year').textContent = String(era.year);
            updateEraVisuals();
            renderStory();
          });
          epochs.appendChild(btn);
        });
      }

      function updateEraVisuals() {
        const current = eras.find((era) => era.id === state.activeEra) || eras[0];
        $('#eraName').textContent = state.lang === 'en' ? current.label : current.skLabel;

        $$('.deco').forEach((layer) => layer.classList.remove('on'));
        const activeLayer = document.getElementById(`d-${state.activeEra}`);
        if (activeLayer) activeLayer.classList.add('on');

        $$('.marker').forEach((marker) => {
          const isActive = marker.dataset.location === state.activeEra;
          marker.classList.toggle('dim', !isActive);
        });

        renderEpochButtons();
      }

      function renderStory() {
        const story = translations[state.lang].stories[state.activeEra];
        $('#storyMeta').textContent = story.meta;
        $('#story-title').textContent = story.title;
        $('#storyText').textContent = story.text;
        const tags = $('#storyTags');
        tags.innerHTML = '';
        story.tags.forEach((tag) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = tag;
          tags.appendChild(btn);
        });
      }

      function bindEvents() {
        $('#random').addEventListener('click', () => {
          const randomEra = eras[Math.floor(Math.random() * eras.length)];
          state.activeEra = randomEra.id;
          state.year = randomEra.year;
          $('#yearSlider').value = String(randomEra.year);
          $('#year').textContent = String(randomEra.year);
          updateEraVisuals();
          renderStory();
        });

        $('#sound').addEventListener('click', () => {
          state.soundOn = !state.soundOn;
          $('#sound').textContent = state.soundOn ? translations[state.lang].soundOn : translations[state.lang].soundOff;
        });

        $('#closeDrawer').addEventListener('click', () => {
          state.drawerOpen = false;
          $('#drawer').classList.remove('open');
        });

        $('#yearSlider').addEventListener('input', (event) => {
          state.year = Number(event.target.value);
          $('#year').textContent = String(state.year);
          const closestEra = eras.reduce((best, era) => {
            const diff = Math.abs(era.year - state.year);
            return diff < Math.abs(best.year - state.year) ? era : best;
          }, eras[0]);
          state.activeEra = closestEra.id;
          updateEraVisuals();
          renderStory();
        });

        $$('.lang-toggle button').forEach((button) => {
          button.addEventListener('click', () => setLanguage(button.dataset.lang));
        });

        $$('.marker').forEach((marker) => {
          marker.addEventListener('click', () => {
            state.activeEra = marker.dataset.location;
            state.year = Number(marker.dataset.year);
            $('#yearSlider').value = String(state.year);
            $('#year').textContent = String(state.year);
            updateEraVisuals();
            renderStory();
            state.drawerOpen = true;
            $('#drawer').classList.add('open');
          });
        });
      }

      createGrid();
      bindEvents();
      updateEraVisuals();
      renderStory();
      setLanguage('en');
    </script>
  </body>
</html>
